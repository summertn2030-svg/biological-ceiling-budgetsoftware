<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CFO Control Panel</title>
    <style>
        body{background:#040812; font-family:sans-serif; color:#EFF3FC; padding:30px;}
        .container{max-width:800px; margin:0 auto;}
        .header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
        .card{background:#0C1424; padding:20px; border-radius:12px; margin-bottom:15px; border:1px solid #1E3454;}
        .big{font-size:2rem; font-weight:bold; color:#2AD4FF; font-family:monospace;}
        .btn{padding:10px 20px; border:none; border-radius:6px; color:white; cursor:pointer; font-weight:bold;}
        .primary{background:#0077B6;}
        .danger{background:#A32E2E;}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 CFO Master Live Feed</h1>
        <div>
            <button id="toggleVote" class="btn primary" style="margin-right:8px;">Freeze Audience iPads</button>
            <button id="clear" class="btn danger">🔄 Clear & Start New Session</button>
        </div>
    </div>

    <div class="card">
        <h3>Total Votes Counted: <span id="count" style="color:#60EFFF">0</span></h3>
    </div>

    <div class="card">
        <div>🧬 Average ELT Research Budget</div>
        <div class="big" id="avgElt">$0 (0%)</div>
    </div>
    <div class="card">
        <div>🖨️ Average 3D Bio-Printing Budget</div>
        <div class="big" id="avgBio">$0 (0%)</div>
    </div>
    <div class="card">
        <div>💊 Average Existing Medicine Budget</div>
        <div class="big" id="avgEx">$0 (0%)</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const TOTAL = 10000000;
    let currentVotingState = true;

    socket.on('update', (votes) => {
        document.getElementById('count').innerText = votes.length;
        if(votes.length === 0) {
            document.getElementById('avgElt').innerText = "$0 (0%)";
            document.getElementById('avgBio').innerText = "$0 (0%)";
            document.getElementById('avgEx').innerText = "$0 (0%)";
            return;
        }

        let eSum = 0, bSum = 0, xSum = 0;
        votes.forEach(v => { eSum += v.elt; bSum += v.bio; xSum += v.exist; });

        let len = votes.length;
        let eAvg = eSum / len, bAvg = bSum / len, xAvg = xSum / len;

        document.getElementById('avgElt').innerText = `$${Math.round(eAvg*TOTAL).toLocaleString()} (${(eAvg*100).toFixed(1)}%)`;
        document.getElementById('avgBio').innerText = `$${Math.round(bAvg*TOTAL).toLocaleString()} (${(bAvg*100).toFixed(1)}%)`;
        document.getElementById('avgEx').innerText = `$${Math.round(xAvg*TOTAL).toLocaleString()} (${(xAvg*100).toFixed(1)}%)`;
    });

    document.getElementById('toggleVote').addEventListener('click', () => {
        currentVotingState = !currentVotingState;
        socket.emit('toggle_voting', currentVotingState);
        
        const btn = document.getElementById('toggleVote');
        btn.innerText = currentVotingState ? "Freeze Audience iPads" : "Unfreeze Audience iPads";
        btn.style.background = currentVotingState ? "#0077B6" : "#D4A373";
    });

    document.getElementById('clear').addEventListener('click', () => {
        if(confirm("Are you sure you want to end this session? All current iPad screens will be wiped and unlocked for a fresh round of voting.")) {
            socket.emit('clear');
        }
    });
</script>
</body>
</html>
